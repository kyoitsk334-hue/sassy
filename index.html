<!DOCTYPE html>
<html lang="ja">

<head>
<link rel="stylesheet" href="style.css">

</head>



<body>


<header>
  <header>

<div class="logo">
    <span class="logo-icon">▛S</span>
    <span class="logo-text">Sassy</span>
</div>

<p class="subtitle">
必要な図面へ、最短で。
</p>

</header>
</header>



<main>



<input
type="file"
id="fileInput"
accept=".pdf,.jpg,.jpeg,.png"
hidden
>



<input
type="text"
id="drawingNumber"
placeholder="図面番号（例：A-001）"
>



<input
type="text"
id="drawingName"
placeholder="図面名（例：1階平面図）"
>



<textarea
id="drawingMemo"
placeholder="メモを入力..."
></textarea>




<input
type="text"
id="searchInput"
placeholder="図面番号・ファイル名で検索..."
>



<label>

<input 
type="checkbox"
id="latestOnly"
>

最新版のみ表示

</label>



<br><br>



<button onclick="document.getElementById('fileInput').click()">

＋ 図面を追加

</button>



<div id="fileList"></div>



</main>



<script 
type="module"
src="script.js">
</script>



</body>


</html>
