<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassy</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

main{
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:18px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.name{
    font-size:18px;
    font-weight:bold;
}

.type{
    color:#666;
}
</style>

<link rel="stylesheet" href="style.css"></head>

<body>

<header>Sassy</header>

<main>

<button>＋ 図面を追加</button>

<div class="card">
<div class="name">A-001 平面図.pdf</div>
<div class="type">PDF</div>
</div>

<div class="card">
<div class="name">A-002 配置図.jpg</div>
<div class="type">JPEG</div>
</div>

<div class="card">
<div class="name">A-003 断面図.pdf</div>
<div class="type">PDF</div>
</div>

</main>

<script src="script.js"></script></body>
</html>
