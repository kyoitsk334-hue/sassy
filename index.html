<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sassy</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
    <span class="logo-icon">▛S</span>
    <span class="logo-text">S</span>
</div>

</header>



<main>


<!-- ファイル選択 -->

<input
type="file"
id="fileInput"
accept=".pdf,.jpg,.jpeg,.png,.xlsx"
hidden
>



<!-- 工事名 -->

<input
type="text"
id="projectName"
placeholder="工事名を入力..."
>



<!-- 工種 -->

<input
type="text"
id="categoryName"
placeholder="工種を入力（例：足場工）..."
>



<!-- 資料カテゴリ -->

<select id="documentType">

<option value="SDS">
SDS
</option>

<option value="作業手順書">
作業手順書
</option>

<option value="周知記録">
周知記録
</option>

<option value="出面表">
出面表
</option>

<option value="その他">
その他
</option>

</select>



<!-- 資料名 -->

<input
type="text"
id="documentName"
placeholder="資料名を入力..."
>



<!-- メモ -->

<textarea
id="documentMemo"
placeholder="メモを入力..."
></textarea>



<!-- 検索 -->

<input
type="text"
id="searchInput"
placeholder="工種・資料名で検索..."
>



<!-- 最新版 -->

<label>

<input 
type="checkbox"
id="latestOnly"
>

最新版のみ表示

</label>



<br><br>



<!-- 追加ボタン -->

<button 
id="addButton"
onclick="document.getElementById('fileInput').click()"
>

＋ 資料を追加

</button>



<!-- 一覧表示 -->

<div id="fileList"></div>



</main>



<script 
type="module"
src="script.js">
</script>



</body>


</html>
