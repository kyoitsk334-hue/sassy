<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sassy</title>


<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}


header{

    background:#4f46e5;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;

}


main{

    padding:20px;

}



input,
textarea{

    width:100%;
    padding:12px;
    margin-bottom:10px;

    border-radius:8px;
    border:1px solid #ccc;

    box-sizing:border-box;

}



button{

    width:100%;
    padding:15px;

    border:none;
    border-radius:10px;

    background:#4f46e5;
    color:white;

    font-size:18px;

    margin-bottom:10px;

}



.card{

    background:white;

    padding:15px;

    border-radius:12px;

    margin-bottom:12px;

    box-shadow:
    0 2px 8px rgba(0,0,0,0.1);

}



.name{

    font-size:18px;

    font-weight:bold;

}



.type{

    color:#666;

}



.date{

    color:#777;

    font-size:14px;

    margin-top:8px;

}



.memo{

    margin-top:8px;

}



.card button{

    font-size:14px;

    padding:10px;

}



</style>


</head>



<body>


<header>

Sassy

</header>



<main>



<input
type="file"
id="fileInput"
accept=".pdf,.jpg,.jpeg,.png"
hidden
>



<input
type="text"
id="drawingNumber"
placeholder="図面番号（例：A-001）"
>



<input
type="text"
id="drawingName"
placeholder="図面名（例：1階平面図）"
>



<textarea
id="drawingMemo"
placeholder="メモを入力..."
></textarea>




<input
type="text"
id="searchInput"
placeholder="図面番号・ファイル名で検索..."
>



<label>

<input 
type="checkbox"
id="latestOnly"
>

最新版のみ表示

</label>



<br><br>



<button onclick="document.getElementById('fileInput').click()">

＋ 図面を追加

</button>



<div id="fileList"></div>



</main>



<script 
type="module"
src="script.js">
</script>



</body>


</html>
