<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sassy</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      text-align:center;
      margin:0;
      padding:50px;
    }

    h1{
      color:#4f46e5;
      font-size:48px;
    }

    .card{
      background:white;
      max-width:400px;
      margin:auto;
      padding:30px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    button{
      background:#4f46e5;
      color:white;
      border:none;
      padding:15px 30px;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#3730a3;
    }
  </style>
</head>

<body>

<div class="card">
<h1>Sassy</h1>

<p>図面管理システムへようこそ！</p>

<button onclick="alert('Sassyへようこそ！')">
スタート
</button>

</div>

</body>
</html>
