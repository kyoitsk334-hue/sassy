<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sassy</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f8;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

main{
    padding:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:18px;
    margin-bottom:20px;
}

input{
    background:white;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.name{
    font-size:18px;
    font-weight:bold;
}

.type{
    color:#666;
}

.card button{
    margin-top:10px;
    background:#ef4444;
    font-size:14px;
    padding:10px;
}
</style>

</head>

<body>

<header>Sassy</header>

<main>

<input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" hidden multiple>


<input 
type="text"
id="drawingNumber"
placeholder="図面番号（例：A-001）"
style="width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;"
>


<input 
type="text"
id="drawingName"
placeholder="図面名（例：1階平面図）"
style="width:100%;padding:12px;margin-bottom:20px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;"
>


<input
type="text"
id="searchInput"
placeholder="図面番号・ファイル名で検索..."
style="width:100%;padding:12px;margin-bottom:20px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;"
>


<button onclick="document.getElementById('fileInput').click()">
＋ 図面を追加
</button>


<div id="fileList"></div>


</main>


<script src="script.js"></script>

</body>
</html>
