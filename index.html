<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sassy</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
    <span class="logo-icon">▛S</span>
    <span class="logo-text">S</span>
</div>

</header>



<main>


<!-- ファイル選択 -->

<input
type="file"
id="fileInput"
accept=".pdf,.jpg,.jpeg,.png,.xlsx"
hidden
>



<!-- 工事名 -->

<input
type="text"
id="projectName"
placeholder="工事名を入力..."
>



<!-- 工種 -->

<input
type="text"
id="categoryName"
placeholder="工種を入力（例：足場工）..."
>



<!-- 書類種類 -->

<select id="documentType">

<option value="SDS">
SDS
</option>

<option value="手順書">
手順書
</option>

<option value="出面表">
出面表
</option>

<option value="その他">
その他
</option>

</select>



<!-- 資料名 -->

<input
type="text"
id="documentName"
placeholder="資料名を入力..."
>

<!-- フォルダ -->

<select id="folderName">

<option value="安全書類">
安全書類
</option>

<option value="図面">
図面
</option>

<option value="写真">
写真
</option>

<option value="協力会社">
協力会社
</option>

<option value="その他">
その他
</option>

</select>

<textarea
id="documentMemo"
placeholder="メモを入力..."
></textarea>



<!-- 検索 -->

<input
type="text"
id="searchInput"
placeholder="工種・資料名で検索..."
>



<label>

<input 
type="checkbox"
id="latestOnly"
>

最新版のみ表示

</label>



<br><br>



<button
id="addButton"
onclick="document.getElementById('fileInput').click()"
>
<div id="folderBar">

<button class="folderBtn" data-folder="すべて">
📁 すべて
</button>

<button class="folderBtn" data-folder="安全書類">
📁 安全書類
</button>

<button class="folderBtn" data-folder="図面">
📁 図面
</button>

<button class="folderBtn" data-folder="写真">
📁 写真
</button>

<button class="folderBtn" data-folder="協力会社">
📁 協力会社
</button>

</div>
＋ 資料を追加

</button>



<div id="fileList"></div>



</main>



<script
type="module"
src="script.js">
</script>


</body>

</html>
